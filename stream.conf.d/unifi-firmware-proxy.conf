stream {
  map_hash_bucket_size 128;
  map_hash_max_size 4096;
  resolver 9.9.9.9 1.1.1.1 valid=30s ipv6=off;

  log_format sni '$remote_addr:$remote_port -> $ssl_preread_server_name ($protocol) '
                 'upstream=$upstream_addr status=$status';
  access_log /var/log/nginx/stream_access.log sni;

  map $ssl_preread_server_name $ubnt_upstream {
    # UniFi controller (inform) — раскомментируйте и укажите свой домен/адрес
    # v1.example.com                          172.17.0.1:8443;

    # Основные серверы обновлений
    fw-download.ubnt.com                    fw-download.ubnt.com:443;
    fw-download.ui.com                      fw-download.ui.com:443;
    fw-update.ubnt.com                      fw-update.ubnt.com:443;
    fw-update.ui.com                        fw-update.ui.com:443;

    # APT-репозитории (EA / RC / beta)
    apt.artifacts.ui.com                    apt.artifacts.ui.com:443;
    apt-beta.artifacts.ui.com               apt-beta.artifacts.ui.com:443;
    apt-release-candidate.artifacts.ui.com  apt-release-candidate.artifacts.ui.com:443;

    # CDN прошивок и пакетов Network Application
    dl.ui.com                               dl.ui.com:443;
    dl.ubnt.com                             dl.ubnt.com:443;

    # Иконки устройств в UI (опционально)
    static.ubnt.com                         static.ubnt.com:443;

    default                                 "";
  }

  server {
    listen 443;
    # Публичные IP ваших площадок + IP туннеля (если ходят через VPN)
    # allow x.x.x.x;
    # Если трафик идёт через WireGuard/L2TP — добавьте подсеть туннеля:
    # allow x.x.x.x/24;
    # deny all;

    ssl_preread on;
    preread_timeout 10s;

    proxy_pass $ubnt_upstream;
    proxy_bind 0.0.0.0;
    proxy_ssl_server_name on;
    proxy_connect_timeout 10s;
    proxy_timeout 300s;
  }
}
